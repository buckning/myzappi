AWSTemplateFormatVersion: '2010-09-09'
Description: MyZappi Lambda functions and compute permissions.

Parameters:
  EnvironmentName:
    Type: String
    Default: staging
    AllowedPattern: '^[a-z0-9][a-z0-9-]*$'
    MaxLength: 20

  FoundationStackName:
    Type: String
    Default: myzappi-staging-foundation
    Description: Stack containing the DynamoDB tables and application KMS key.

  ArtifactBucketName:
    Type: String
    Default: myzappi-staging-builds
    Description: Existing private S3 bucket containing the Lambda JAR files.

  ApiArtifactKey:
    Type: String
    Default: api-all.jar

  AlexaArtifactKey:
    Type: String
    Default: myzappi-alexa-lambda-all.jar

  SqsHandlerArtifactKey:
    Type: String
    Default: sqs-handler-all.jar

  StateReconcilerArtifactKey:
    Type: String
    Default: state-reconciler-all.jar

  AutomationProcessorArtifactKey:
    Type: String
    Default: automation-processor-all.jar

  ReconciliationQueueName:
    Type: String
    Default: device-state-reconcile-requests.fifo
    Description: FIFO queue created by the messaging stack.

  ReconciliationQueueUrl:
    Type: String
    Default: ''
    Description: URL of the reconciliation FIFO queue. Leave empty until the queue exists.

  EnableStateReconcilerTrigger:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Enable the SQS event source mapping after the queue has been created.

  AlexaClientId:
    Type: String
    Default: ''
    NoEcho: true

  AlexaClientSecret:
    Type: String
    Default: ''
    NoEcho: true

  SkillId:
    Type: String
    Default: not-configured

  EddiSkillId:
    Type: String
    Default: not-configured

  LibbiSkillId:
    Type: String
    Default: not-configured

  LoginUrl:
    Type: String
    Default: http://localhost:8080/login

  AdminUser:
    Type: String
    Default: not-configured

  DevFeatureEnabled:
    Type: String
    Default: 'false'

  GraphBucketName:
    Type: String
    Default: myzappi-autogenerated-graphs-staging

Conditions:
  StateReconcilerTriggerEnabled:
    Fn::Equals:
      - Ref: EnableStateReconcilerTrigger
      - 'true'

Resources:
  ApplicationDataAccessPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Shared MyZappi staging access to application tables and encrypted data.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ApplicationTables
            Effect: Allow
            Action:
              - dynamodb:BatchGetItem
              - dynamodb:BatchWriteItem
              - dynamodb:DeleteItem
              - dynamodb:DescribeTable
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:Query
              - dynamodb:Scan
              - dynamodb:UpdateItem
            Resource:
              - Fn::ImportValue:
                  Fn::Sub: ${FoundationStackName}-SessionTableArn
              - Fn::ImportValue:
                  Fn::Sub: ${FoundationStackName}-ZappiLoginCredentialsTableArn
              - Fn::ImportValue:
                  Fn::Sub: ${FoundationStackName}-MyEnergiCredentialsTableArn
              - Fn::ImportValue:
                  Fn::Sub: ${FoundationStackName}-TariffTableArn
              - Fn::ImportValue:
                  Fn::Sub: ${FoundationStackName}-AlexaToLwaLookupTableArn
              - Fn::ImportValue:
                  Fn::Sub: ${FoundationStackName}-DeviceStateReconcileRequestsTableArn
              - Fn::ImportValue:
                  Fn::Sub: ${FoundationStackName}-AutomationTableArn
              - Fn::ImportValue:
                  Fn::Sub: ${FoundationStackName}-AutomationStateTableArn
              - Fn::ImportValue:
                  Fn::Sub: ${FoundationStackName}-AutomationProcessorLockTableArn
              - Fn::ImportValue:
                  Fn::Sub: ${FoundationStackName}-ScheduleTableArn
              - Fn::ImportValue:
                  Fn::Sub: ${FoundationStackName}-ScheduleDetailsTableArn
              - Fn::ImportValue:
                  Fn::Sub: ${FoundationStackName}-DevicesTableArn
              - Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/*/index/*
          - Sid: ApplicationEncryption
            Effect: Allow
            Action:
              - kms:Decrypt
              - kms:DescribeKey
              - kms:Encrypt
              - kms:GenerateDataKey
            Resource:
              Fn::ImportValue:
                Fn::Sub: ${FoundationStackName}-DataKeyArn

  ApiExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Execution role for the MyZappi REST API Lambda.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - Ref: ApplicationDataAccessPolicy
      Policies:
        - PolicyName: ApiSchedulerAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - scheduler:CreateSchedule
                  - scheduler:DeleteSchedule
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/*
              - Effect: Allow
                Action: iam:PassRole
                Resource:
                  Fn::GetAtt: SchedulerExecutionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: scheduler.amazonaws.com
              - Effect: Allow
                Action: sqs:SendMessage
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:${ReconciliationQueueName}
      Tags:
        - Key: Application
          Value: MyZappi
        - Key: Environment
          Value: Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation

  AlexaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Execution role for the MyZappi Alexa Lambda.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - Ref: ApplicationDataAccessPolicy
      Policies:
        - PolicyName: AlexaAsyncAndStorageAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:${ReconciliationQueueName}
              - Effect: Allow
                Action:
                  - scheduler:CreateSchedule
                  - scheduler:DeleteSchedule
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/*
              - Effect: Allow
                Action: iam:PassRole
                Resource:
                  Fn::GetAtt: SchedulerExecutionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: scheduler.amazonaws.com
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:s3:::${GraphBucketName}/*
      Tags:
        - Key: Application
          Value: MyZappi
        - Key: Environment
          Value: Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation

  SqsHandlerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Execution role for scheduled MyZappi actions.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - Ref: ApplicationDataAccessPolicy
      Policies:
        - PolicyName: SqsHandlerReconciliationAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:${ReconciliationQueueName}
      Tags:
        - Key: Application
          Value: MyZappi
        - Key: Environment
          Value: Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation

  StateReconcilerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Execution role for the SQS-driven state reconciler.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - Ref: ApplicationDataAccessPolicy
      Policies:
        - PolicyName: StateReconcilerQueueAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ChangeMessageVisibility
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                  - sqs:ReceiveMessage
                  - sqs:SendMessage
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:${ReconciliationQueueName}
      Tags:
        - Key: Application
          Value: MyZappi
        - Key: Environment
          Value: Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation

  AutomationProcessorExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Execution role for the scheduled automation processor.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - Ref: ApplicationDataAccessPolicy
      Policies:
        - PolicyName: AutomationProcessorAsyncAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:${ReconciliationQueueName}
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:automation-processor
      Tags:
        - Key: Application
          Value: MyZappi
        - Key: Environment
          Value: Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation

  SchedulerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: EventBridge Scheduler role used by application-created schedules.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount:
                  Ref: AWS::AccountId
      Policies:
        - PolicyName: InvokeScheduleTarget
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  Fn::GetAtt: SqsHandlerFunction.Arn
      Tags:
        - Key: Application
          Value: MyZappi
        - Key: Environment
          Value: Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: /aws/lambda/api
      RetentionInDays: 14

  AlexaLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: /aws/lambda/myzappi-alexa-lambda
      RetentionInDays: 14

  SqsHandlerLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: /aws/lambda/sqs-handler
      RetentionInDays: 14

  StateReconcilerLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: /aws/lambda/state-reconciler
      RetentionInDays: 14

  AutomationProcessorLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: /aws/lambda/automation-processor
      RetentionInDays: 14

  ApiFunction:
    Type: AWS::Lambda::Function
    DependsOn: ApiLogGroup
    Properties:
      FunctionName: api
      Runtime: java21
      Architectures: [x86_64]
      Handler: com.amcglynn.myzappi.api.ApiRequestHandler::handleRequest
      Role:
        Fn::GetAtt: ApiExecutionRole.Arn
      Code:
        S3Bucket:
          Ref: ArtifactBucketName
        S3Key:
          Ref: ApiArtifactKey
      MemorySize: 512
      Timeout: 30
      Environment:
        Variables:
          awsRegion:
            Ref: AWS::Region
          kmsKeyArn:
            Fn::ImportValue:
              Fn::Sub: ${FoundationStackName}-DataKeyArn
          sqsQueueUrl:
            Ref: ReconciliationQueueUrl
          schedulerExecutionRoleArn:
            Fn::GetAtt: SchedulerExecutionRole.Arn
          schedulerTargetLambdaArn:
            Fn::GetAtt: SqsHandlerFunction.Arn
          loginUrl:
            Ref: LoginUrl
          adminUser:
            Ref: AdminUser
          devFeatureEnabled:
            Ref: DevFeatureEnabled
      Tags:
        - Key: Application
          Value: MyZappi
        - Key: Environment
          Value:
            Ref: EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation

  AlexaFunction:
    Type: AWS::Lambda::Function
    DependsOn: AlexaLogGroup
    Properties:
      FunctionName: myzappi-alexa-lambda
      Runtime: java21
      Architectures: [x86_64]
      Handler: com.amcglynn.myzappi.MyZappiSkillStreamHandler
      Role:
        Fn::GetAtt: AlexaExecutionRole.Arn
      Code:
        S3Bucket:
          Ref: ArtifactBucketName
        S3Key:
          Ref: AlexaArtifactKey
      MemorySize: 512
      Timeout: 15
      Environment:
        Variables:
          awsRegion:
            Ref: AWS::Region
          kmsKeyArn:
            Fn::ImportValue:
              Fn::Sub: ${FoundationStackName}-DataKeyArn
          sqsQueueUrl:
            Ref: ReconciliationQueueUrl
          schedulerExecutionRoleArn:
            Fn::GetAtt: SchedulerExecutionRole.Arn
          schedulerTargetLambdaArn:
            Fn::GetAtt: SqsHandlerFunction.Arn
          skillId:
            Ref: SkillId
          eddiSkillId:
            Ref: EddiSkillId
          libbiSkillId:
            Ref: LibbiSkillId
          graphBucketName:
            Ref: GraphBucketName
      Tags:
        - Key: Application
          Value: MyZappi
        - Key: Environment
          Value:
            Ref: EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation

  SqsHandlerFunction:
    Type: AWS::Lambda::Function
    DependsOn: SqsHandlerLogGroup
    Properties:
      FunctionName: sqs-handler
      Runtime: java21
      Architectures: [x86_64]
      Handler: com.amcglynn.sqs.EventBridgeHandler::handleRequest
      Role:
        Fn::GetAtt: SqsHandlerExecutionRole.Arn
      Code:
        S3Bucket:
          Ref: ArtifactBucketName
        S3Key:
          Ref: SqsHandlerArtifactKey
      MemorySize: 512
      Timeout: 30
      Environment:
        Variables:
          awsRegion:
            Ref: AWS::Region
          kmsKeyArn:
            Fn::ImportValue:
              Fn::Sub: ${FoundationStackName}-DataKeyArn
          sqsQueueUrl:
            Ref: ReconciliationQueueUrl
          alexaClientId:
            Ref: AlexaClientId
          alexaClientSecret:
            Ref: AlexaClientSecret
      Tags:
        - Key: Application
          Value: MyZappi
        - Key: Environment
          Value:
            Ref: EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation

  StateReconcilerFunction:
    Type: AWS::Lambda::Function
    DependsOn: StateReconcilerLogGroup
    Properties:
      FunctionName: state-reconciler
      Runtime: java21
      Architectures: [x86_64]
      Handler: com.amcglynn.myzappi.reconciler.StateReconcilerHandler::handleRequest
      Role:
        Fn::GetAtt: StateReconcilerExecutionRole.Arn
      Code:
        S3Bucket:
          Ref: ArtifactBucketName
        S3Key:
          Ref: StateReconcilerArtifactKey
      MemorySize: 512
      Timeout: 60
      Environment:
        Variables:
          awsRegion:
            Ref: AWS::Region
          kmsKeyArn:
            Fn::ImportValue:
              Fn::Sub: ${FoundationStackName}-DataKeyArn
          sqsQueueUrl:
            Ref: ReconciliationQueueUrl
      Tags:
        - Key: Application
          Value: MyZappi
        - Key: Environment
          Value:
            Ref: EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation

  StateReconcilerEventSource:
    Type: AWS::Lambda::EventSourceMapping
    Condition: StateReconcilerTriggerEnabled
    Properties:
      BatchSize: 1
      Enabled: true
      EventSourceArn:
        Fn::Sub: arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:${ReconciliationQueueName}
      FunctionName:
        Ref: StateReconcilerFunction

  AutomationProcessorFunction:
    Type: AWS::Lambda::Function
    DependsOn: AutomationProcessorLogGroup
    Properties:
      FunctionName: automation-processor
      Runtime: java21
      Architectures: [x86_64]
      Handler: com.amcglynn.automation.AutomationProcessorHandler::handleRequest
      Role:
        Fn::GetAtt: AutomationProcessorExecutionRole.Arn
      Code:
        S3Bucket:
          Ref: ArtifactBucketName
        S3Key:
          Ref: AutomationProcessorArtifactKey
      MemorySize: 512
      Timeout: 60
      Environment:
        Variables:
          awsRegion:
            Ref: AWS::Region
          kmsKeyArn:
            Fn::ImportValue:
              Fn::Sub: ${FoundationStackName}-DataKeyArn
          sqsQueueUrl:
            Ref: ReconciliationQueueUrl
          automationProcessorLambdaName:
            Ref: AutomationProcessorFunction
      Tags:
        - Key: Application
          Value: MyZappi
        - Key: Environment
          Value:
            Ref: EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation

  AutomationSchedule:
    Type: AWS::Events::Rule
    Properties:
      Description: Periodically evaluate active MyZappi automations.
      Name: automation-processor
      ScheduleExpression: rate(5 minutes)
      State: DISABLED
      Targets:
        - Arn:
            Fn::GetAtt: AutomationProcessorFunction.Arn
          Id: automation-processor

  AutomationSchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName:
        Ref: AutomationProcessorFunction
      Principal: events.amazonaws.com
      SourceArn:
        Fn::GetAtt: AutomationSchedule.Arn

Outputs:
  ApiFunctionArn:
    Description: ARN of the staging API Lambda.
    Value:
      Fn::GetAtt: ApiFunction.Arn
  AlexaFunctionArn:
    Description: ARN of the staging Alexa Lambda.
    Value:
      Fn::GetAtt: AlexaFunction.Arn
  SqsHandlerFunctionArn:
    Description: ARN of the schedule event handler Lambda.
    Value:
      Fn::GetAtt: SqsHandlerFunction.Arn
  StateReconcilerFunctionArn:
    Description: ARN of the state reconciler Lambda.
    Value:
      Fn::GetAtt: StateReconcilerFunction.Arn
  AutomationProcessorFunctionArn:
    Description: ARN of the automation processor Lambda.
    Value:
      Fn::GetAtt: AutomationProcessorFunction.Arn
  SchedulerExecutionRoleArn:
    Description: Role ARN used by application-created EventBridge Scheduler schedules.
    Value:
      Fn::GetAtt: SchedulerExecutionRole.Arn
